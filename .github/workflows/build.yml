name: Build & Release MamadVPN

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - "v*"
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ==========================================
  # Android Build Job
  # ==========================================
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.x"
          channel: "stable"
          cache: true

      - name: Get Dependencies
        run: flutter pub get

      - name: Run Tests
        run: flutter test

      - name: Build Android Release APK (Universal)
        run: flutter build apk --release

      - name: Build Android Release APK (Split Per ABI)
        run: flutter build apk --split-per-abi --release

      - name: Rename APKs for Clarity
        run: |
          mkdir -p output/android
          cp build/app/outputs/flutter-apk/app-release.apk output/android/MamadVPN.apk
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk output/android/MamadVPN-arm64-v8a.apk

      - name: Upload Android Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MamadVPN-Android-APK
          path: output/android/*.apk

  # ==========================================
  # Windows Build Job
  # ==========================================
  build-windows:
    name: Build Windows Application
    runs-on: windows-2022

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up MSVC Developer Environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.x"
          channel: "stable"
          cache: true

      - name: Enable Windows Desktop
        run: flutter config --enable-windows-desktop

      - name: Configure Windows Desktop Platform
        shell: pwsh
        run: |
          if (Test-Path windows) { Remove-Item -Recurse -Force windows }
          flutter create --platforms=windows --project-name mamadvpn .

      - name: Verify Environment & Tools
        run: flutter doctor -v

      - name: Get Dependencies
        run: flutter pub get

      - name: Run Tests
        run: flutter test

      - name: Build Windows Release Executable
        run: flutter build windows --release

      - name: Bundle Xray-Core, Sing-Box & Wintun Driver
        shell: pwsh
        run: |
          $buildDir = "build/windows/x64/runner/Release"
          if (-not (Test-Path $buildDir)) {
            $buildDir = "build/windows/runner/Release"
          }

          # 1. Download official Xray-Core Windows Core (v26.3.27 - v2rayNG/v2rayN engine)
          Write-Host "Downloading Xray-core..."
          Invoke-WebRequest -Uri "https://github.com/XTLS/Xray-core/releases/download/v26.3.27/Xray-windows-64.zip" -OutFile "xray.zip"
          Expand-Archive -Path "xray.zip" -DestinationPath "xray-temp" -Force
          Copy-Item "xray-temp/xray.exe" -Destination "$buildDir\xray.exe" -Force
          if (Test-Path "xray-temp/geoip.dat") { Copy-Item "xray-temp/geoip.dat" -Destination "$buildDir\geoip.dat" -Force }
          if (Test-Path "xray-temp/geosite.dat") { Copy-Item "xray-temp/geosite.dat" -Destination "$buildDir\geosite.dat" -Force }
          if (Test-Path "xray-temp/wintun.dll") { Copy-Item "xray-temp/wintun.dll" -Destination "$buildDir\wintun.dll" -Force }
          Write-Host "Xray-Core bundled successfully into $buildDir"

          # 2. Download official Sing-Box Windows Core (v1.11.4)
          Write-Host "Downloading Sing-Box core..."
          Invoke-WebRequest -Uri "https://github.com/SagerNet/sing-box/releases/download/v1.11.4/sing-box-1.11.4-windows-amd64.zip" -OutFile "sing-box.zip"
          Expand-Archive -Path "sing-box.zip" -DestinationPath "sing-box-temp" -Force
          $singBoxExe = Get-ChildItem -Path "sing-box-temp" -Filter "sing-box.exe" -Recurse | Select-Object -First 1
          if ($singBoxExe) {
            Copy-Item $singBoxExe.FullName -Destination "$buildDir\sing-box.exe" -Force
            Write-Host "Sing-Box bundled successfully into $buildDir"
          }

      - name: Package Windows Release ZIP
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path output/windows
          $buildDir = "build/windows/x64/runner/Release"
          if (Test-Path $buildDir) {
            Compress-Archive -Path "$buildDir/*" -DestinationPath "output/windows/MamadVPN-Windows-x64.zip" -Force
          } else {
            # Fallback path if target architecture is default runner
            Compress-Archive -Path "build/windows/runner/Release/*" -DestinationPath "output/windows/MamadVPN-Windows-x64.zip" -Force
          }

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MamadVPN-Windows-x64
          path: output/windows/MamadVPN-Windows-x64.zip

  # ==========================================
  # Release Job (Automatic on Main & Tags)
  # ==========================================
  release:
    name: Publish GitHub Release
    needs: [build-android, build-windows]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Compute Release Tag & Name
        id: release_info
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT
            echo "title=MamadVPN ${{ github.ref_name }}" >> $GITHUB_OUTPUT
          else
            echo "tag=v1.0.${{ github.run_number }}" >> $GITHUB_OUTPUT
            echo "title=MamadVPN v1.0.${{ github.run_number }}" >> $GITHUB_OUTPUT
          fi

      - name: Download Android Artifacts
        uses: actions/download-artifact@v4
        with:
          name: MamadVPN-Android-APK
          path: release-assets/android

      - name: Download Windows Artifacts
        uses: actions/download-artifact@v4
        with:
          name: MamadVPN-Windows-x64
          path: release-assets/windows

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_info.outputs.tag }}
          name: ${{ steps.release_info.outputs.title }}
          files: |
            release-assets/android/*.apk
            release-assets/windows/*.zip
          body: |
            ## 🛡️ MamadVPN Release

            ### 📱 Android (Direct APK Download)
            - **MamadVPN.apk** — Standalone Android APK (Universal, runs on all Android devices)
            - **MamadVPN-arm64-v8a.apk** — Optimized for modern 64-bit phones

            ### 💻 Windows
            - **MamadVPN-Windows-x64.zip** — Standalone portable package (Unzip and run `mamadvpn.exe`)
          generate_release_notes: true
          draft: false
          prerelease: false
