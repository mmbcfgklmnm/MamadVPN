name: mamadvpn
description: "MamadVPN - Sleek, High-Performance Multi-Protocol VPN Client for Windows and Android."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management & Architecture
  provider: ^6.1.2

  # Networking & Parsing
  http: ^1.2.1

  # Local Persistence
  shared_preferences: ^2.2.3

  # Formatting & Internationalization
  intl: ^0.19.0

  # Native & Utilities
  path_provider: ^2.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
